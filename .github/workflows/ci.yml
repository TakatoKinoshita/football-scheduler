name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify Lambda dependency export
        run: |
          uv export --locked --no-dev --no-emit-project --no-header --output-file /tmp/requirements-lambda.txt
          diff --unified requirements-lambda.txt /tmp/requirements-lambda.txt

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest


  placement-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify placement template catalog
        run: |
          uv run python scripts/generate_placement_templates.py --check | tee /tmp/placement-template-check.txt
          cat /tmp/placement-template-check.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deterministic 32-team production path
        run: uv run python scripts/verify_production_path.py --repeat 2 --maximum-seconds 30

      - name: Verify deterministic 16-team optimized template path
        run: uv run python scripts/verify_production_path.py --profile sixteen --repeat 2 --maximum-seconds 30

      - name: Verify placement templates in wheel
        run: |
          uv build --wheel --out-dir /tmp/football-scheduler-wheel
          uv run python scripts/check_placement_template_wheel.py /tmp/football-scheduler-wheel

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build PWA
        run: |
          npm run build
          npm run build:functions

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test production PWA in Chromium
        run: npm run test:e2e

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate production template
        env:
          SAM_CLI_TELEMETRY: "0"
        run: |
          sam validate --lint --template-file infra/production/template.yaml
          sam validate --lint --template-file infra/production/bootstrap.yaml

      - name: Build lightweight authorizer package
        env:
          SAM_CLI_TELEMETRY: "0"
        run: |
          sam build \
            --template-file infra/production/template.yaml \
            --parameter-overrides \
              SolverImageUri=000000000000.dkr.ecr.us-east-1.amazonaws.com/solver@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
              ReleaseId=ci-validation \
              OriginVerifyValue=01234567890123456789012345678901 \
              TurnstileSecretKey=01234567890123456789 \
              PublicUsageApiKeyValue=01234567890123456789
          cd /tmp
          PYTHONPATH="$GITHUB_WORKSPACE/.aws-sam/build/ApiAuthorizerFunction" \
            uv run --no-project --python 3.14 python -S -c "import football_scheduler.authorizer"
