<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>トーナメント表レイアウト比較</title>
  </head>
  <body>
    <header class="preview-header">
      <p class="eyebrow">ローカル比較専用</p>
      <h1>上位トーナメント表レイアウト</h1>
      <p>本番画面やAPIを使わず、固定fixtureと差替え可能なレイアウトを確認します。</p>
    </header>
    <main class="preview-main">
      <form id="preview-controls" class="preview-controls" aria-label="プレビュー設定">
        <label>
          <span>サンプル</span>
          <select id="preview-fixture" name="fixture"></select>
        </label>
        <label>
          <span>レイアウト</span>
          <select id="preview-layout" name="layout"></select>
        </label>
        <output id="preview-status" role="status" aria-live="polite"></output>
      </form>
      <section id="preview-capture" class="preview-capture" aria-labelledby="preview-heading">
        <div class="preview-summary">
          <p class="eyebrow">上位トーナメントのみ</p>
          <h2 id="preview-heading">生成中…</h2>
          <p id="preview-description"></p>
        </div>
        <div id="preview-output"></div>
      </section>
    </main>
    <script type="module" src="/src/tournament-bracket-preview.ts"></script>
  </body>
</html>
