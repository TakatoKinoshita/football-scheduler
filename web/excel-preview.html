<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Excelプレビュー</title>
  </head>
  <body class="excel-preview-body">
    <main class="excel-preview-panel">
      <p class="eyebrow">LOCAL EXCEL PREVIEW</p>
      <h1>Excel workbook生成確認</h1>
      <p id="excel-preview-description"></p>
      <label>
        固定fixture
        <select id="excel-preview-fixture"></select>
      </label>
      <p class="excel-preview-file">出力ファイル：<strong id="excel-preview-file-name"></strong></p>
      <button id="excel-preview-download" type="button">Excelを生成して保存</button>
      <p id="excel-preview-error" class="excel-preview-error" role="alert"></p>
    </main>
    <div id="excel-preview-workbook" class="excel-preview-workbook" aria-label="Excel印刷プレビュー"></div>
    <script type="module" src="/src/excel-preview.ts"></script>
  </body>
</html>
