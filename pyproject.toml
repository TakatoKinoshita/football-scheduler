[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "football-scheduler"
version = "0.1.0"
description = "地域サッカー大会の日程生成・検証"
requires-python = ">=3.14"
dependencies = [
  "ortools>=9.15,<10",
  "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/football_scheduler"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend-exclude = [".claude/skills"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["football_scheduler"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true
